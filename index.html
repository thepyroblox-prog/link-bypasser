
<script>
function checkLink() {
  const value = document.getElementById("link").value.trim();
  const result = document.getElementById("result");

  if (!value) {
    result.textContent = "Please enter a link!";
    return;
  }

  try {
    const url = new URL(value);

    if (url.protocol !== "https:" && url.protocol !== "http:") {
      throw new Error();
    }

    result.textContent = "Website: " + url.hostname +
      " | Protocol: " + url.protocol;
  } catch (error) {
    result.textContent = "Invalid link! Try again.";
  }
}
</script>
